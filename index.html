:root{
  --bg:#fdf1e4; --card:#fbeedb; --frame:#fff8f0; --line:#f6d6bd; --peach:#fdd5b5; --peach2:#fee7d3;
  --navy:#15256d; --navy2:#4c5a96; --orange:#ff4c0c; --orange2:#ff6a2b; --orange-d:#c93a07;
  --yellow:#f5a800; --green:#cfeac4; --green-d:#3f9a37; --green-t:#1f5e1d; --red:#ffd6c9; --red-d:#e8431a; --red-t:#b01c08; --bangred:#d3121b;
  --opt:#fff9f1; --shadow:0 3px 0 rgba(224,160,120,.35);
  --head:'Montserrat Alternates','Montserrat',system-ui,sans-serif; --h2:'MAnum','Montserrat',system-ui,sans-serif; --body:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:var(--body);font-weight:500;color:var(--navy);background:var(--bg);min-height:100vh;
  background-image:radial-gradient(circle at 92% -2%,#fcd9c0 0 70px,transparent 71px),radial-gradient(circle at 4% 104%,#fcd9c0 0 110px,transparent 111px),radial-gradient(circle at 50% 108%,#fde2cd 0 90px,transparent 91px);
  background-attachment:fixed;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
img{display:block}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 100px;position:relative}

/* ---------- шапка как на слайдах ---------- */
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 10px}
.brand .l,.brand .r{display:flex;align-items:center;gap:8px;font-family:var(--head);font-weight:800;color:var(--navy);font-size:12px;line-height:1.05;letter-spacing:.2px;text-transform:uppercase}
.brand img{height:34px;width:auto}
.brand .r img{height:36px}
.title{font-family:var(--head);font-weight:800;text-transform:uppercase;text-align:center;line-height:1.02;margin:6px 0 14px;font-size:clamp(34px,10.6vw,52px);color:var(--navy);letter-spacing:-.4px}
.title span{display:block;color:var(--orange);font-size:.8em;margin-top:2px}
.lead{text-align:center;margin:0 6px 14px;font-size:15px;line-height:1.45;color:var(--navy2);font-weight:600}

/* ---------- карточки и плашки ---------- */
.card{background:var(--card);border:5px solid var(--frame);box-shadow:0 0 0 2px var(--line);border-radius:26px;padding:16px 16px 18px;margin:14px 2px}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--peach2);border-radius:14px;padding:6px 14px 6px 6px;font-family:var(--h2);font-weight:800;font-size:15px;color:var(--navy);white-space:nowrap}
.pill i{width:26px;height:26px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;flex:none}
.pill i svg{width:15px;height:15px;fill:#fff3c9}
.pill.p-R i{background:#f0602a}.pill.p-V i{background:var(--yellow)}.pill.p-D i{background:#e0501b}
.tag{display:inline-block;background:var(--green);color:var(--green-t);font-weight:800;font-size:12px;border-radius:10px;padding:5px 10px;margin-left:6px;font-family:var(--h2)}
.tag.retry{background:#ffe0a8;color:#8a5200}
.row{display:flex;align-items:center;gap:10px}
.sp{height:10px}.sp2{height:16px}

/* ---------- кнопки ---------- */
.btn{display:block;width:100%;background:var(--orange2);color:#fff;font-family:var(--h2);font-weight:800;font-size:19px;letter-spacing:.2px;padding:15px 18px;border-radius:18px;box-shadow:0 4px 0 var(--orange-d);transition:transform .08s,box-shadow .08s,filter .15s;text-align:center;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--orange-d)}
.btn:disabled{filter:grayscale(.55) opacity(.55);box-shadow:0 4px 0 #b9a99b;background:#d9a98a;cursor:default}
.btn.ghost{background:var(--frame);color:var(--navy);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.small{font-size:15px;padding:10px 14px;border-radius:14px}
.btn.green{background:#4caa3e;box-shadow:0 4px 0 #2f7d27}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:14px;background:var(--frame);border:2px solid var(--line);font-family:var(--h2);font-weight:800;font-size:14px;color:var(--navy);box-shadow:var(--shadow);transition:transform .08s}
.chip:active{transform:translateY(2px)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 3px 0 #0b1646}

/* ---------- прогресс ---------- */
.lab{font-family:var(--head);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--navy2);margin:0 0 8px}
.rankrow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.rankname{font-family:var(--h2);font-weight:800;font-size:21px;color:var(--navy)}
.xp{font-weight:700;font-size:13px;color:var(--navy2)}
.bar{height:12px;border-radius:8px;background:#f4d9c1;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#ff7a2e,#ff4c0c);width:0;transition:width .5s cubic-bezier(.3,1.3,.5,1)}
.tp{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;margin:14px 0 0}
.tp .nm{font-family:var(--h2);font-weight:800;font-size:15px}
.tp .stars{display:flex;gap:3px}
.tp .stars svg{width:17px;height:17px;fill:#ecd2bb}.tp .stars svg.on{fill:var(--yellow)}
.tp .bar{grid-column:1/3;height:9px}
.stats{display:flex;gap:8px;margin-top:16px}
.stat{flex:1;background:var(--peach2);border-radius:16px;padding:10px 6px;text-align:center}
.stat b{display:block;font-family:var(--head);font-weight:800;font-size:22px;line-height:1.1;color:var(--navy)}
.stat small{font-size:11px;font-weight:700;color:var(--navy2)}
.cat1{position:absolute;right:-6px;bottom:-4px;width:92px;pointer-events:none}
.homecat{position:relative}
.linkbtn{display:block;margin:10px auto 0;font-size:12px;color:var(--navy2);text-decoration:underline;opacity:.8;padding:8px}

/* ---------- игровой экран ---------- */
.hud{display:flex;align-items:center;gap:10px;margin:2px 2px 8px}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--frame);border:2px solid var(--line);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px;fill:none;stroke:var(--navy);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.hud .mid{flex:1;min-width:0}
.hud .rn{display:flex;justify-content:space-between;font-family:var(--h2);font-weight:800;font-size:13px;margin-bottom:5px}
.hud .rn span:last-child{color:var(--navy2);font-family:var(--body);font-weight:700;font-size:11px;align-self:center}
.hud .bar{height:9px}
.streak{display:flex;align-items:center;gap:3px;font-family:var(--head);font-weight:800;font-size:20px;color:var(--orange);min-width:50px;justify-content:center}
.streak svg{width:22px;height:22px}
.streak.hot{animation:pop .5s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.qcard{margin-top:8px}
.qtop{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-bottom:14px}
.qtext{font-weight:700;font-size:clamp(17px,5vw,21px);line-height:1.38;margin:0 0 16px}
.qtext b{font-family:var(--h2);font-weight:800}
.qtext .ev{color:var(--orange);font-weight:800}
.qtext .note{display:block;font-size:13px;color:var(--navy2);font-weight:600;margin-top:4px}
.qtext .rom{font-size:1.5em;letter-spacing:1px}
.opts{display:grid;gap:10px;grid-template-columns:1fr}
.opts.two{grid-template-columns:1fr 1fr}
.opt{background:var(--opt);border:2.5px solid var(--line);border-radius:18px;padding:14px 12px;text-align:center;font-weight:700;font-size:17px;box-shadow:var(--shadow);transition:transform .08s,border-color .15s,background .15s;min-height:56px;display:flex;align-items:center;justify-content:center;line-height:1.25}
.opt.mono{font-family:var(--h2);font-weight:800;font-size:19px}
.opt:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.opt:hover:not(:disabled){border-color:#f0b78e}
.opt.sel{border-color:var(--orange);background:#ffe9d9}
.opt.ok{background:var(--green);border-color:var(--green-d);color:var(--green-t);animation:pop .4s}
.opt.no{background:var(--red);border-color:var(--red-d);color:var(--red-t);animation:shake .4s}
.opt.miss{border:2.5px dashed var(--green-d);background:#ecf7e6}
.opt:disabled{cursor:default}
.opt.dim{opacity:.55}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}50%{transform:translateX(6px)}80%{transform:translateX(-3px)}}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf .opt{min-height:64px;font-family:var(--h2);font-weight:800;font-size:19px}
.tf .opt:first-child{border-color:#bfe0b4}.tf .opt:last-child{border-color:#f7c3b3}

/* сборка числа */
.board{min-height:78px;background:var(--frame);border:2.5px dashed var(--line);border-radius:18px;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;margin-bottom:12px;flex-wrap:wrap}
.board .ph{color:#d2b79c;font-weight:700;font-size:14px}
.tile{min-width:52px;height:56px;padding:0 10px;border-radius:14px;background:var(--navy);color:#fff;font-family:var(--head);font-weight:800;font-size:28px;display:grid;place-items:center;box-shadow:0 3px 0 #0b1646;animation:pop .25s}
.board.ok .tile{background:#3f9a37;box-shadow:0 3px 0 #2f7d27}
.board.no .tile{background:var(--red-d);box-shadow:0 3px 0 #a52a0a}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.key{height:60px;border-radius:16px;background:var(--opt);border:2.5px solid var(--line);box-shadow:var(--shadow);font-family:var(--head);font-weight:800;font-size:28px}
.key:active:not(:disabled){transform:translateY(2px);box-shadow:none}
.key.del svg{width:26px;height:26px;fill:none;stroke:var(--navy);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;margin:auto}
.key:disabled{opacity:.5}

/* расстановка */
.slots{display:grid;gap:8px;margin-bottom:12px}
.slot{display:flex;align-items:center;gap:10px;min-height:54px;border-radius:16px;border:2.5px dashed var(--line);background:var(--frame);padding:6px 10px;text-align:left;width:100%}
.slot .nn{width:28px;height:28px;border-radius:50%;background:var(--peach);font-family:var(--head);font-weight:800;font-size:14px;display:grid;place-items:center;flex:none}
.slot .tx{font-family:var(--h2);font-weight:800;font-size:16px;line-height:1.2}
.slot.full{border-style:solid;border-color:var(--orange);background:#fff1e4}
.slot.ok{background:var(--green);border-color:var(--green-d);color:var(--green-t)}
.slot.no{background:var(--red);border-color:var(--red-d);color:var(--red-t)}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pool .opt{min-height:48px;padding:9px 12px;font-size:15px;flex:1 1 44%}
.pool .opt.used{display:none}

/* пары */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-bottom:4px}
.match .opts{grid-auto-rows:68px}.match .opt{min-height:0;font-size:15px;padding:6px 6px}
.match .opt.lk0{background:#ffe0b8;border-color:#f0a24a}.match .opt.lk1{background:#cfe6f7;border-color:#6fb0e0}
.match .opt.lk2{background:#e8d8f6;border-color:#a77ad6}.match .opt.lk3{background:var(--green);border-color:var(--green-d)}
.match .opt.pick{border-color:var(--navy);background:#e9ecfa}

/* паспорт */
.pp{display:grid;gap:14px}
.pp .pl{font-family:var(--head);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--navy2);margin-bottom:6px}
.pp .opts{gap:8px}.pp .opt{min-height:50px;font-size:15px;padding:10px 8px}

/* ---------- разбор ---------- */
.sheet{position:relative;border-radius:26px;padding:16px 16px 18px;margin:16px 2px 0;border:5px solid var(--frame);box-shadow:0 0 0 2px var(--line);overflow:hidden;animation:up .28s cubic-bezier(.2,1.2,.4,1)}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet.ok{background:#e6f5de}.sheet.no{background:#ffe6dc}
.sh-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.sh-title{font-family:var(--h2);font-weight:800;font-size:22px;line-height:1.1}
.sheet.ok .sh-title{color:var(--green-t)}.sheet.no .sh-title{color:var(--red-t)}
.gain{display:inline-block;background:var(--yellow);color:#fff;border-radius:10px;padding:3px 9px;font-family:var(--h2);font-weight:800;font-size:14px;margin-left:8px;vertical-align:middle}
.ans{font-weight:700;font-size:15px;margin:2px 0 8px}
.ans b{font-family:var(--h2);font-weight:800}
.expl{font-size:15px;line-height:1.5;margin:6px 0 12px;font-weight:600}
.calc{background:rgba(255,255,255,.7);border-radius:16px;padding:11px 14px;margin:8px 0;font-family:var(--h2);font-weight:700;font-size:clamp(17px,5vw,20px);line-height:1.6;color:var(--navy);word-wrap:break-word}
.calc b{font-weight:800}
.calc s{color:#6d77a8;text-decoration-color:var(--bangred);text-decoration-thickness:3px}
.calc .arr{color:var(--orange);font-weight:800}
.calc .plus{display:inline-block;background:var(--yellow);color:#fff;border-radius:7px;padding:0 8px;font-weight:800}
.calc .okm,.calc .nom{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;color:#fff;font-size:14px;vertical-align:middle}
.calc .okm{background:#4caa3e}.calc .nom{background:var(--red-d)}
.rule{background:rgba(255,255,255,.45);border-radius:12px;padding:7px 12px;margin:6px 0;font-size:14px;line-height:1.45;font-weight:600}
.sheet .btn{margin-top:12px}
.catfb{width:58px;height:auto;flex:none;pointer-events:none}
.up{margin:8px 0;background:#fff3c9;border:2px solid #f5cf6a;border-radius:14px;padding:8px 12px;font-weight:800;font-size:14px;font-family:var(--h2)}

/* ---------- шпаргалка ---------- */
.modal{position:fixed;inset:0;background:rgba(21,37,109,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mbox{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:28px 28px 0 0;padding:0 16px 30px;animation:up .28s cubic-bezier(.2,1.2,.4,1)}
.mbox h2{font-family:var(--head);font-weight:800;text-transform:uppercase;font-size:24px;margin:0 0 12px;text-align:center;line-height:1.05}
.mbox h2 span{color:var(--orange)}
.mbox .card{margin:12px 2px;padding:14px}
.mbox .calc{background:#fff8ef}
.mbox ul{margin:6px 0;padding-left:20px;font-size:14.5px;line-height:1.55;font-weight:600}
.x{position:sticky;float:right;top:0;margin-top:-4px}

/* ---------- подвал ---------- */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,248,240,.96);border-top:2px solid var(--line);backdrop-filter:blur(6px);padding:8px 14px calc(8px + env(safe-area-inset-bottom))}
.foot .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.foot img{height:36px;width:auto}
.foot .tx{flex:1;font-family:var(--head);font-weight:800;font-size:13px;line-height:1.1;text-transform:uppercase;color:var(--navy)}
.foot .tx small{display:block;font-family:var(--body);font-weight:600;font-size:11px;text-transform:none;color:var(--navy2);margin-top:2px}
.foot a{background:var(--orange2);color:#fff;text-decoration:none;font-family:var(--h2);font-weight:800;font-size:15px;padding:10px 18px;border-radius:14px;box-shadow:0 3px 0 var(--orange-d)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--navy);color:#fff;font-weight:700;font-size:14px;padding:10px 16px;border-radius:14px;z-index:60;animation:up .25s;max-width:90vw;text-align:center}
.conf{position:fixed;top:-12px;width:10px;height:14px;z-index:70;pointer-events:none;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate3d(var(--dx),105vh,0) rotate(720deg);opacity:.9}}
@media (min-width:700px){.wrap{padding-top:28px}.title{font-size:56px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.peek{height:118px;overflow:hidden;display:flex;justify-content:center;margin-top:6px;pointer-events:none}
.peek img{width:150px;height:auto;align-self:flex-start}
.note2{min-height:4px}

.vb{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none}.vb svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.vb.ok{background:#4caa3e}.vb.no{background:var(--red-d)}

.tbl{width:100%;border-collapse:collapse;background:#fff8ef;border-radius:14px;overflow:hidden;font-size:14px;margin:10px 0 4px;border:2px solid var(--line)}
.tbl th{background:var(--peach2);font-family:var(--h2);font-weight:800;font-size:14px;padding:9px 6px;text-align:center;border-bottom:2px solid var(--line)}
.tbl td{padding:8px 6px;text-align:center;border-top:1.5px solid #f6dfcb;font-weight:700;line-height:1.25}
.tbl td+td,.tbl th+th{border-left:1.5px solid #f6dfcb}
.tbl td small{display:block;font-size:12px;font-weight:600;color:var(--navy2);margin-top:2px}
.tbl.sm td{padding:5px 4px;font-size:13.5px;font-family:var(--h2);font-weight:800}
.tbl.sm th{font-size:12px;padding:7px 4px}
.tbl3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tbl2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tbl3 .tbl,.tbl2 .tbl{margin:8px 0 0}
.bang{display:flex;align-items:center;gap:8px;margin:10px 2px 2px;color:var(--bangred);font-family:var(--h2);font-weight:800;font-size:16px}
.bang span{font-size:26px;line-height:1}

.mtop{position:sticky;top:0;z-index:3;display:flex;justify-content:flex-end;padding:12px 0 4px;background:linear-gradient(var(--bg) 75%,rgba(253,241,228,0))}
.mbox h2{margin-top:-6px}

</style>
</head>

<script>
/* ===================================================================
   ВЕКА · ДЕСЯТИЛЕТИЯ · РИМСКИЕ ЦИФРЫ — движок заданий
   Правила — ровно со слайдов «Как определить век?», «Как определить десятилетие?»,
   «Десятилетия: два способа счёта», «Арабские или римские цифры?».
   Задания генерируются «на лету» из случайных чисел, поэтому тренажёр почти бесконечный.

/* ---------- случайность (с зерном, чтобы ошибку можно было спросить ещё раз точь-в-точь) ---------- */
var RNG = Math.random;
function seeded(seed){
  var a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rnd(n){ return Math.floor(RNG() * n); }
function rndi(a, b){ return a + rnd(b - a + 1); }
function pick(a){ return a[rnd(a.length)]; }
function chance(p){ return RNG() < p; }
function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--){ var j = rnd(i + 1), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function uniq(a){ var s = {}, o = []; a.forEach(function(x){ if (!s[x]){ s[x] = 1; o.push(x); } }); return o; }

/* ---------- римские цифры ---------- */
function toRoman(n){
  var map = [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']], s = '';
  map.forEach(function(p){ while (n >= p[0]){ s += p[1]; n -= p[0]; } });
  return s;
}
function fromRoman(s){
  var v = {I:1, V:5, X:10}, t = 0;
  for (var i = 0; i < s.length; i++){ var a = v[s[i]], b = v[s[i + 1]] || 0; t += a < b ? -a : a; }
  return t;
}
function sumAdditive(s){ var v = {I:1, V:5, X:10}, t = 0; for (var i = 0; i < s.length; i++) t += v[s[i]]; return t; }
function additiveWrong(n){                 // «IIII», «VIIII» — популярная ошибка
  var u = n % 10; if (u !== 4 && u !== 9) return null;
  return (n >= 10 ? toRoman(n - u) : '') + (u === 4 ? 'IIII' : 'VIIII');
}
function parts(n){                           // X + VIII
  var t = Math.floor(n / 10), u = n % 10, p = [];
  if (t) p.push({r: toRoman(t * 10), v: t * 10});
  if (u) p.push({r: toRoman(u), v: u});
  return p;
}
function breakdown(n){
  var p = parts(n);
  if (p.length < 2) return '<b>' + toRoman(n) + '</b> = ' + n;
  return '<b>' + toRoman(n) + '</b> = ' + p.map(function(x){ return x.r; }).join(' + ') + ' = ' + p.map(function(x){ return x.v; }).join(' + ') + ' = ' + n;
}

/* ---------- века и десятилетия ---------- */
function century(y){ return Math.floor((y - 1) / 100) + 1; }
function cRange(c){ return [(c - 1) * 100 + 1, c * 100]; }
function decName(y){ return Math.floor(y / 10) * 10; }                       // 1745 → 1740 («1740-е годы»)
function decOrd(y){ return Math.floor(((y - 1) % 100) / 10) + 1; }          // 1740 → 4, 1741 → 5
function ordRange(c, k){ var a = (c - 1) * 100 + (k - 1) * 10 + 1; return [a, a + 9]; }
function rng(a, b){ return a + '–' + b; }
function rngOf(r){ return rng(r[0], r[1]); }
function nameRange(d){ return [d, d + 9]; }
function lblName(d){ return d + '-е годы'; }
function lblShort(d){ var s = d % 100; return (s < 10 ? '0' + s : s) + '-е годы ' + toRoman(century(d)) + ' века'; }
function lblOrd(c, k){ return k + '-е десятилетие ' + toRoman(c) + ' века'; }
function century_(y){ return toRoman(century(y)) + ' век'; }

/* ---------- события (для «живых» вопросов) ---------- */
var EVENTS = [
  [862, 'Призвание Рюрика (по летописи)'], [882, 'Князь Олег объединяет Новгород и Киев'], [988, 'Крещение Руси'],
  [1147, 'Первое упоминание Москвы в летописи'], [1223, 'Битва на Калке'], [1237, 'Нашествие Батыя на Русь'],
  [1240, 'Невская битва'], [1242, 'Ледовое побоище'], [1380, 'Куликовская битва'], [1480, 'Стояние на реке Угре'],
  [1547, 'Венчание Ивана IV на царство'], [1552, 'Взятие Казани'], [1613, 'Избрание на царство Михаила Романова'],
  [1654, 'Переяславская рада'], [1703, 'Основание Санкт-Петербурга'], [1709, 'Полтавская битва'],
  [1721, 'Россия провозглашена империей'], [1861, 'Отмена крепостного права'], [1917, 'Октябрьская революция'],
  [1941, 'Начало Великой Отечественной войны'], [1945, 'Победа в Великой Отечественной войне'],
  [1961, 'Первый полёт человека в космос'], [1991, 'Распад СССР']
];

/* год нужной «сложности»: 1 — без подвохов, 2 — иногда пограничные, 3 — часто пограничные */
function edgeYear(){
  var c = rndi(9, 20), base = (c - 1) * 100;
  var y = pick([base, base + 1, base + 9, base + 10, base + 11, base + 99, base + 100, base + 100, base + 1]);
  return Math.min(2000, Math.max(801, y));
}
function plainYear(lvl){
  var y;
  do { y = rndi(lvl === 1 ? 1000 : 801, lvl === 1 ? 1899 : 2000); } while (y % 100 < 2 || y % 100 > 98 || y % 10 === 0 || y % 10 === 9 || y % 10 === 1);
  return y;
}
function anyYear(lvl){ return chance(lvl === 1 ? 0 : (lvl === 2 ? .3 : .55)) ? edgeYear() : plainYear(lvl); }
/* год, при желании — с историческим событием */
function yearWithEvent(lvl, pEvent){
  if (chance(pEvent)){
    var pool = EVENTS.filter(function(e){ return lvl > 1 || (e[0] % 100 > 1 && e[0] % 100 < 99 && e[0] % 10 !== 0); });
    if (pool.length){ var e = pick(pool); return {y: e[0], ev: e[1]}; }
  }
  return {y: anyYear(lvl), ev: ''};
}

/* ---------- мелкие помощники для HTML ---------- */
function B(s){ return '<b>' + s + '</b>'; }
function evTag(ev){ return ev ? '<span class="ev">' + ev + '</span> — ' : ''; }
function choice(correct, wrongs, n){
  n = n || 4;
  var out = [{t: correct, ok: true}], seen = {}; seen[correct] = 1;
  wrongs.forEach(function(w){ if (out.length < n && !seen[w]){ seen[w] = 1; out.push({t: w, ok: false}); } });
  return shuffle(out);

/* ---------- сохранение ---------- */
function fresh(){ return {v: 1, xp: 0, best: 0, streak: 0, n: 0, ok: 0, m: {}, t: {R: {lv: 1, h: []}, V: {lv: 1, h: []}, D: {lv: 1, h: []}}, focus: 'all', retry: [], last: [], sigs: []}; }
function load(){ try { var s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1 && s.t) return s; } catch (e) {} return fresh(); }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch (e) {} }
function mastery(s){ return ST.m[s] || 0; }
function topicMastery(t){ var a = TOPICS[t].skills, s = 0; a.forEach(function(k){ s += mastery(k); }); return s / a.length; }
function rankInfo(xp){
  var i = 0; RANKS.forEach(function(r, k){ if (xp >= r[0]) i = k; });
  var lo = RANKS[i][0], hi = i < RANKS.length - 1 ? RANKS[i + 1][0] : null;
  return {i: i, name: RANKS[i][1], lo: lo, hi: hi, pct: hi ? Math.round((xp - lo) / (hi - lo) * 100) : 100};
}
function wpick(items, weights){
  var sum = weights.reduce(function(a, b){ return a + b; }, 0), r = Math.random() * sum;
  for (var i = 0; i < items.length; i++){ r -= weights[i]; if (r <= 0) return items[i]; }
  return items[items.length - 1];
}

/* ---------- выбор следующего задания ---------- */
function chooseSkill(){
  var tops = ST.focus === 'all' ? ['R', 'V', 'D'] : [ST.focus];
  var base = {R: .2, V: .3, D: .5};
  var t = wpick(tops, tops.map(function(x){ return (ST.focus === 'all' ? base[x] : 1) * (1.3 - topicMastery(x)); }));
  var sk = TOPICS[t].skills, cand = sk.filter(function(s){ return ST.last.indexOf(s) < 0; });
  if (!cand.length) cand = sk;
  return wpick(cand, cand.map(function(s){ return .25 + (1 - mastery(s)); }));
}
function buildNext(){
  var q = null, di = -1;
  ST.retry.forEach(function(r, i){ if (di < 0 && r.at <= ST.n) di = i; });
  if (di >= 0 && Math.random() < .9){
    var r = ST.retry.splice(di, 1)[0];
    q = makeQuestion(r.skill, r.lvl, r.seed); q.retry = true; q.rtry = r.c || 1;
  } else {
    for (var k = 0; k < 10; k++){
      var sk = chooseSkill(), lv = ST.t[sk.charAt(0).toUpperCase()].lv;
      q = makeQuestion(sk, lv, Math.floor(Math.random() * 2147483647));
      if (ST.sigs.indexOf(q.sig) < 0) break;
    }
  }
  ST.sigs = [q.sig].concat(ST.sigs).slice(0, 14);
  ST.last = [q.skill].concat(ST.last).slice(0, 2);
  return q;
}

      '<li><b>По названию</b> — годы от 0 до 9: 1710-е годы — 1710–1719.</li>' +
      '<li><b>По номеру</b> считаем от начала века: 1-е десятилетие XVIII века — 1701–1710, 2-е — 1711–1720.</li>' +
      '<li>1700 год — это 1700-е годы, но ещё XVII век и его 10-е десятилетие (1691–1700).</li>' +
      '<li>Для экзамена записывайте полностью: 1230-е годы или 30-е годы XIII века, а не просто «30-е годы».</li></ul>' +
      '<div class="lab" style="margin-top:12px">Таблица для века:</div><div class="chips" id="cc">' + chips + '</div><div id="dt">' + tblDec(20) + '</div></div>' +
    '</div>';
  document.body.appendChild(m);
  function close(){ if (m.parentNode) m.parentNode.removeChild(m); }
  $('#mx', m).onclick = close; m.onclick = function(e){ if (e.target === m) close(); };
  $('#cc', m).onclick = function(e){
    var b = e.target.closest('.chip'); if (!b) return;
    $$('.chip', m).forEach(function(x){ x.classList.toggle('on', x === b); });
    $('#dt', m).innerHTML = tblDec(+b.dataset.c);
  };
}

document.addEventListener('DOMContentLoaded', function(){
  app = $('#app'); ST = load(); home();
});

</script>
